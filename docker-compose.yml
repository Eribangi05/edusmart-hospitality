# Production stack. Caddy gets and renews the HTTPS certificate automatically.
#   cp backend/.env.example backend/.env   (edit it)   then:   docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-hospitality.edusmartconsult.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
  web:
    build: { context: ./backend, target: web }
    restart: unless-stopped
    depends_on: [app]
  app:
    build: { context: ./backend, target: app }
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [db, redis]
    volumes: [app_storage:/var/www/html/storage]
  scheduler:
    build: { context: ./backend, target: app }
    restart: unless-stopped
    env_file: ./backend/.env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on: [db, redis]
    volumes: [app_storage:/var/www/html/storage]
  queue:
    build: { context: ./backend, target: app }
    restart: unless-stopped
    env_file: ./backend/.env
    command: php artisan queue:work --tries=3 --max-time=3600
    depends_on: [db, redis]
    volumes: [app_storage:/var/www/html/storage]
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hospitality}
      MYSQL_USER: ${DB_USERNAME:-hospitality}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in the shell or a .env next to this file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
volumes:
  app_storage:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
