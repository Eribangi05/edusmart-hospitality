# Production-style stack. Put TLS (Caddy/Traefik/Cloudflare) in front of `web`.
services:
  app:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [db, redis]
    volumes:
      - app_storage:/var/www/html/storage
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [app]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on: [db, redis]
    volumes:
      - app_storage:/var/www/html/storage
  queue:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: php artisan queue:work --tries=3 --max-time=3600
    depends_on: [db, redis]
    volumes:
      - app_storage:/var/www/html/storage
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hospitality}
      MYSQL_USER: ${DB_USERNAME:-hospitality}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes: [db_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
volumes:
  app_storage:
  db_data:
  redis_data:
