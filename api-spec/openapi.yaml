openapi: 3.1.0
info:
  title: Edusmart Hospitality API
  version: 0.1.0
  description: Draft contract (Phase 0). Source of truth for backend and Android.
servers:
  - url: https://api.hospitality.edusmartconsult.com/api/v1
security:
  - bearer: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200': { description: OK }
  /auth/login:
    post:
      security: []
      summary: Log in from a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '202': { description: 2FA required, content: { application/json: { schema: { $ref: '#/components/schemas/TwoFactorChallenge' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/2fa:
    post:
      security: []
      summary: Complete a 2FA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string }
                code: { type: string }
      responses:
        '200': { description: Token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
  /auth/refresh:
    post:
      security: []
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              properties:
                refresh_token: { type: string }
                device_id: { type: string, format: uuid }
      responses:
        '200': { description: Token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Log out this device
      responses:
        '204': { description: Logged out }
  /me/context:
    get:
      summary: Current user, tenant, properties, enabled modules and effective permissions
      responses:
        '200': { description: Context, content: { application/json: { schema: { $ref: '#/components/schemas/MeContext' } } } }
  /devices:
    get:
      summary: List devices (owner)
      responses:
        '200': { description: Devices }
  /devices/{id}/revoke:
    post:
      summary: Revoke a device
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revoked }
  /sync/push:
    post:
      summary: Push a batch of outbox items (max 100)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200': { description: Per-item results, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } } }
  /sync/pull:
    get:
      summary: Pull changes since a cursor
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: entities, in: query, schema: { type: string }, description: Comma-separated entity names }
        - { name: limit, in: query, schema: { type: integer, maximum: 500, default: 200 } }
      responses:
        '200': { description: Changes, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullResponse' } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [device_revoked, validation_failed, forbidden, module_disabled, subscription_suspended] }
            message: { type: string }
            details: { type: object }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Whole units; RWF has no minor unit }
        currency: { type: string, enum: [RWF] }
    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device:
          type: object
          required: [id, name, platform, app_version]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            platform: { type: string, enum: [android, web] }
            app_version: { type: string }
            push_token: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
    TwoFactorChallenge:
      type: object
      required: [challenge_id]
      properties:
        challenge_id: { type: string }
    MeContext:
      type: object
      properties:
        user: { type: object }
        tenant: { type: object }
        properties: { type: array, items: { type: object } }
        modules: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string }, description: 'e.g. rooms.view, pos.void' }
        locale: { type: string, enum: [en, fr, rw] }
    SyncPushItem:
      type: object
      required: [id, entity, op, payload, idempotency_key]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string }
        op: { type: string, enum: [create, update, void] }
        base_version: { type: integer }
        idempotency_key: { type: string }
        client_time: { type: string, format: date-time }
        payload: { type: object }
    SyncPushRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SyncPushItem' } }
    SyncPushResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [applied, duplicate, conflict, rejected] }
        reason: { type: string }
        server_version: { type: integer }
    SyncPushResponse:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/SyncPushResult' } }
    SyncPullResponse:
      type: object
      properties:
        changes: { type: array, items: { type: object } }
        tombstones: { type: array, items: { type: object } }
        next_cursor: { type: string }
        has_more: { type: boolean }
